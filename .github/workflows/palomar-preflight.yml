name: Palomar preflight

# Runs the checks of the Palomar registry (https://palomar-registry.org) on this repository,
# on GitHub's own runners. It builds the project from scratch, checks that every Lean file
# uses the module system, and runs Comparator with comparator.json.
#
# Start it by hand from the Actions tab before a submission. It can take an hour or more.
#
# The workflow reference and `pipeline_commit` must name the same PalomarSubmission commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
