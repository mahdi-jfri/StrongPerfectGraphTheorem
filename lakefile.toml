name = "StrongPerfectGraphTheorem"
defaultTargets = ["StrongPerfectGraphTheorem", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

# The formalization: every module under `StrongPerfectGraphTheorem/`.
[[lean_lib]]
name = "StrongPerfectGraphTheorem"

# The statement of the theorem, with `sorry`, for Comparator. It imports only Mathlib.
[[lean_lib]]
name = "Challenge"

# The same statement, proved.
[[lean_lib]]
name = "Solution"
